name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release artifacts must match the latest code on main. A tag pushed from
      # an older local commit would otherwise publish that stale snapshot.
      - name: Verify tag points at latest main
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          MAIN_COMMIT=$(git rev-parse refs/remotes/origin/main)
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::error::${GITHUB_REF_NAME} points to ${TAG_COMMIT}, but origin/main is ${MAIN_COMMIT}. Move the tag to the latest main commit before releasing."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} points at latest main (${MAIN_COMMIT})"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Quality gates before anything is published.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Generate GitHub release
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `bun publish` on the Linux runner does not reliably pick up
      # `~/.npmrc` (verified: it fails with "missing authentication" even
      # with a literal token written there). NPM_CONFIG_TOKEN is bun's
      # native auth env var and works (verified locally with a clean HOME).
      - name: Publish
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
